title: "[Idea] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        这里适合先讨论还不确定是否应该进入 public API 的想法。
        已经明确要做的能力，可以直接打开 Feature issue。
  - type: textarea
    id: scenario
    attributes:
      label: 重复场景
      description: 哪类工程问题在多个项目里反复出现？
      placeholder: 多个服务都在重复写相同的缓存重建逻辑...
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: 为什么适合 Under-Utils
      description: 简单说明为什么 JDK、Spring、Hutool、Apache Commons、Guava 或现有模块不能直接覆盖。
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: 边界
      description: 哪些应该放进工具包，哪些应该留在业务项目里？
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: 可能的用法
      description: 可选。简单写一下最小 API、配置项或示例用法。
    validations:
      required: false
