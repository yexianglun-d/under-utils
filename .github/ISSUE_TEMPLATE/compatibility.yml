name: 兼容性问题
description: 反馈升级版本后出现的行为、API 或依赖兼容问题
title: "[Compatibility] "
labels:
  - bug
body:
  - type: input
    id: from-version
    attributes:
      label: 原版本
      placeholder: 1.0.4
    validations:
      required: true

  - type: input
    id: to-version
    attributes:
      label: 目标版本
      placeholder: 1.0.5
    validations:
      required: true

  - type: input
    id: module
    attributes:
      label: 受影响模块
      placeholder: under-utils-ai-starter
    validations:
      required: true

  - type: textarea
    id: breakage
    attributes:
      label: 升级后现象
      description: 编译失败、运行行为变化、依赖冲突或配置变化都可以写在这里。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现
      description: 可复现的依赖声明、配置、代码或错误日志。
      render: text
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: 临时绕法
      description: 可选。如果你已经找到临时解决方式，请写出来，方便判断兼容影响。
    validations:
      required: false
