<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Under-Utils social preview</title>
  <desc id="desc">Spring Boot engineering-pattern utilities for Java 21.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#cbd5e1" stroke-width="1" opacity="0.45"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.55"/>
  <path d="M0 502 C220 438 374 548 570 496 C748 448 855 322 1048 352 C1148 368 1220 432 1280 410 L1280 640 L0 640 Z" fill="#dbeafe" opacity="0.72"/>
  <g transform="translate(96 92)">
    <rect x="0" y="0" width="1088" height="456" rx="28" fill="#ffffff" opacity="0.92" filter="url(#shadow)"/>
    <rect x="36" y="38" width="220" height="42" rx="21" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="64" y="66" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" fill="#2563eb">Java 21 / Spring Boot</text>
    <text x="36" y="166" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="78" font-weight="800" fill="#0f172a">Under-Utils</text>
    <text x="40" y="222" font-family="IBM Plex Sans, Avenir Next, Segoe UI, sans-serif" font-size="32" font-weight="700" fill="#334155">Engineering patterns for business systems</text>
    <text x="40" y="276" font-family="IBM Plex Sans, Avenir Next, Segoe UI, sans-serif" font-size="24" fill="#475569">Context propagation, rate limits, Redis cache, OpenAPI clients, AI clients.</text>
    <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700">
      <rect x="40" y="336" width="124" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="62" y="364" fill="#1d4ed8">Context</text>
      <rect x="178" y="336" width="146" height="42" rx="10" fill="#ecfdf5" stroke="#bbf7d0"/>
      <text x="200" y="364" fill="#047857">RateLimit</text>
      <rect x="338" y="336" width="166" height="42" rx="10" fill="#fefce8" stroke="#fde68a"/>
      <text x="360" y="364" fill="#a16207">Redis Cache</text>
      <rect x="518" y="336" width="118" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="540" y="364" fill="#334155">OpenAPI</text>
      <rect x="650" y="336" width="128" height="42" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
      <text x="672" y="364" fill="#6d28d9">AI Client</text>
    </g>
    <text x="40" y="426" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="20" fill="#64748b">Maven Central: io.github.yexianglun-d / MIT License</text>
  </g>
